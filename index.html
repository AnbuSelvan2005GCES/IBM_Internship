<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Student Support Assistant</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    margin: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    color: #111827;
  }
  header p {
    font-size: 12px;
    color: #6b7280;
    margin: 2px 0 0;
  }
  #clearBtn {
    background: none;
    border: 1px solid #d1d5db;
    color: #374151;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  #clearBtn:hover { background: #f3f4f6; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #f3f4f6;
    color: #111827;
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }
  .msg.typing {
    align-self: flex-start;
    background: #f3f4f6;
    color: #6b7280;
    font-style: italic;
  }

  form {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid #e5e7eb;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    height: 44px;
  }
  textarea:focus { outline: 2px solid #2563eb33; border-color: #2563eb; }
  button[type="submit"] {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button[type="submit"]:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 12px;
  }
  .suggestions button {
    background: #eef2ff;
    color: #3730a3;
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .suggestions button:hover { background: #e0e7ff; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>AI Student Support Assistant</h1>
      <p>Regulations · Syllabus · FAQs · Notices</p>
    </div>
    <button id="clearBtn" title="Start a new conversation">New chat</button>
  </header>

  <div id="chat"></div>

  <div class="suggestions" id="suggestions">
    <button data-q="What is the attendance requirement?">Attendance rules</button>
    <button data-q="Are there any upcoming deadlines?">Upcoming deadlines</button>
    <button data-q="How do I apply for a scholarship?">Scholarships</button>
    <button data-q="What topics are covered in the syllabus?">Syllabus</button>
  </div>

  <form id="chatForm">
    <textarea id="questionInput" placeholder="Ask about regulations, syllabus, FAQs, or notices..." required></textarea>
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
  // Point this at your backend if it's not running on the same origin/port.
  const API_BASE = "http://127.0.0.1:8000";

  // Each browser tab keeps its own session_id for the lifetime of the page,
  // so the backend's Memory component can track this conversation.
  // (Not persisted across reloads by design — click "New chat" is the same
  // as a fresh session anyway.)
  let sessionId = crypto.randomUUID();

  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("chatForm");
  const inputEl = document.getElementById("questionInput");
  const sendBtn = document.getElementById("sendBtn");
  const clearBtn = document.getElementById("clearBtn");
  const suggestionsEl = document.getElementById("suggestions");

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function sendQuestion(question) {
    if (!question.trim()) return;

    addMessage(question, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const typingEl = addMessage("Thinking...", "typing");

    try {
      const response = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, question })
      });

      const data = await response.json();
      typingEl.remove();

      if (!response.ok) {
        addMessage(data.detail || "Something went wrong. Please try again.", "error");
        return;
      }

      addMessage(data.answer, "assistant");
    } catch (err) {
      typingEl.remove();
      addMessage(
        "Couldn't reach the assistant. Make sure the backend is running at " + API_BASE,
        "error"
      );
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    sendQuestion(inputEl.value);
  });

  // Enter sends, Shift+Enter adds a newline
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  suggestionsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-q]");
    if (!btn) return;
    sendQuestion(btn.dataset.q);
  });

  clearBtn.addEventListener("click", async () => {
    try {
      await fetch(`${API_BASE}/history/${sessionId}`, { method: "DELETE" });
    } catch (err) {
      // Non-fatal — starting a new session below clears things client-side anyway.
    }
    sessionId = crypto.randomUUID();
    chatEl.innerHTML = "";
    addMessage("New conversation started. Ask me anything about regulations, syllabus, FAQs, or notices.", "assistant");
  });

  // Greeting on load
  addMessage("Hi! I can help with questions about regulations, syllabus, FAQs, and notices. What would you like to know?", "assistant");
</script>

</body>
</html>
