<!DOCTYPE html>

<html>

<head>

    <title>AI IT Helpdesk</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            white-space: pre-wrap;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🤖 AI IT Helpdesk Agent</h1>

    <p>
        Describe your technical problem.
    </p>

    <textarea
        id="problem"
        placeholder="Example: My WiFi is connected but internet is not working">
    </textarea>

    <button onclick="diagnose()">
        Diagnose Problem
    </button>

    <div id="result"></div>

</div>


<script>

async function diagnose() {

    const problem =
        document.getElementById("problem").value;

    const result =
        document.getElementById("result");

    result.innerText =
        "AI Agent is diagnosing...";

    const response = await fetch(
        "http://127.0.0.1:8000/diagnose",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                problem: problem
            })
        }
    );

    const data = await response.json();

    result.innerText =
        data.diagnosis;
}

</script>

</body>

</html>
